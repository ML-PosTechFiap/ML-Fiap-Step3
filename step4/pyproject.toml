[project]
name = "medical-triage-onnx"
version = "0.1.0"
description = "Educational API for medical text urgency classification, with ONNX-optimized inference."
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.116,<1.0",
    "uvicorn[standard]>=0.35,<1.0",
    "prometheus-client>=0.20,<1.0",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "joblib>=1.6.0",
    "skl2onnx>=1.16,<2.0",
    "onnxruntime>=1.19,<2.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=8.4,<10.0",
    "ruff>=0.12,<1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src", "scripts"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
