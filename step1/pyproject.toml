[project]
name = "medical-triage-api"
version = "0.1.0"
description = "Educational API for medical text urgency classification."
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.116,<1.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=8.4,<10.0",
    "ruff>=0.12,<1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# ARG unused-arguments, DTZ naive-datetime, FAST FastAPI-specific checks,
# INP implicit-namespace-package, N pep8-naming, PD pandas-vet, RUF
# ruff-specific rules, S flake8-bandit (security) were added after a manual
# `ruff check --select ALL` sweep turned up real findings under each of
# them (see the git history for what got fixed) -- keeping them enabled so
# the same classes of issue get caught automatically going forward.
select = ["ARG", "B", "DTZ", "E", "F", "FAST", "I", "INP", "N", "PD", "RUF", "S", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest expresses checks -- S101 is meant for asserts in
# shipped/production code, not test suites.
"tests/*" = ["S101"]
