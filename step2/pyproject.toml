[project]
name = "step2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.6.0",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["scripts"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# ARG unused-arguments, DTZ naive-datetime, INP implicit-namespace-package,
# N pep8-naming, PD pandas-vet, RUF ruff-specific rules, S flake8-bandit
# (security) were added after a manual `ruff check --select ALL` sweep
# turned up real findings under each of them (see the git history for what
# got fixed) -- keeping them enabled so the same classes of issue get
# caught automatically going forward.
select = ["ARG", "B", "DTZ", "E", "F", "I", "INP", "N", "PD", "RUF", "S", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest expresses checks -- S101 is meant for asserts in
# shipped/production code, not test suites.
"tests/*" = ["S101"]
