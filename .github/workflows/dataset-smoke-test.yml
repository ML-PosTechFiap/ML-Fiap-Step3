name: Dataset smoke test

# Exercises the real download + cleaning pipeline against the live Hugging
# Face mirror. Kept out of the main CI gate (ci.yml) because it depends on
# an external service and moves a ~14 MB file — run it on a schedule and on
# demand instead of on every push/PR.
on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:

jobs:
  smoke-test:
    name: Download and validate dataset
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: step2
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: step2/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Download raw dataset
        run: uv run python scripts/download_dataset.py

      - name: Clean and validate dataset
        run: uv run python scripts/prepare_dataset.py

      - name: Sanity-check row counts
        run: |
          uv run python -c "
          import json
          report = json.loads(open('data/processed/validation_report.json').read())
          assert report['raw_rows'] > 40000, report
          assert report['final_rows'] > 35000, report
          assert set(report['label_distribution']) == {'urgent', 'non-urgent'}, report
          print('OK:', report)
          "

      - name: Publish validation report
        run: cat data/processed/validation_report.json >> "$GITHUB_STEP_SUMMARY"
